name: 주문 동기화

on:
  schedule:
    - cron: '40 3 * * *'   # 12:40 KST (포장 PC 12:10 게시 후)
    - cron: '40 9 * * *'   # 18:40 KST (18:00 게시 후)
    - cron: '0 13 * * *'   # 22:00 KST 보정
  workflow_dispatch:

concurrency:
  group: ledger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        working-directory: sync
        run: npm install --no-audit --no-fund
      - name: 동기화 실행
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync.mjs
