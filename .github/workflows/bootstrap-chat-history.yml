name: Initialize conversation Google access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: initialize-conversation-google-access
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Firebase dependency
        working-directory: sync
        run: npm install --no-audit --no-fund
      - name: Verify rules and initialize private access
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHAT_HISTORY_UNLOCK_SECRET: ${{ secrets.CHAT_HISTORY_UNLOCK_SECRET }}
        run: node bootstrap-google-access.mjs
